<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#245a43" />
    <title>Reconnect — Rice POS</title>
    <style>
      body {
        margin: 0;
        background: #f7f8f5;
        color: #294532;
        font:
          16px system-ui,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 360px;
        padding: 32px;
        text-align: center;
      }
      img {
        border-radius: 20px;
      }
      h1 {
        font-size: 25px;
        margin-top: 24px;
      }
      p {
        color: #687560;
        line-height: 1.7;
      }
      button {
        background: #245a43;
        color: white;
        border: 0;
        border-radius: 8px;
        min-height: 48px;
        padding: 12px 24px;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Let’s get you reconnected.</h1>
      <p>
        Connect to your shop’s network and make sure the POS server is running.
        Sales need a live connection to update stock and save payments.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
